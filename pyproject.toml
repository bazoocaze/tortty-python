[project]
name = "bzmux"
version = "0.1.0"
description = "Terminal em Python com abas, workspaces e imagens"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

# O console script: `pipx install --system-site-packages` instala e o comando
# `bzmux` aparece no PATH. run() (e nao main()) porque o entry point chama a
# funcao sem argumentos e precisa fazer sys.exit com o codigo.
[project.scripts]
bzmux = "bzmux.cli:run"

[project.optional-dependencies]
# so as ferramentas de teste manual (tools/) precisam disto; o app usa o
# PyGObject do sistema, que nao se instala por pip sem sofrimento
tools = ["python-xlib>=0.33"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bzmux"]

[tool.uv]
# o app roda no python do sistema (PyGObject vem da distro); este venv serve
# para os testes, entao basta usar o mesmo interpretador do sistema
python-preference = "system"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# largura escolhida: o código foi escrito a 79, mas o terminal tem 137
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E501 é redundante com o formatter (que já quebra o código no limite);
# comentário e docstring longos são texto, não código
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# gui.py é o único ponto que importa Gtk/cairo e os reexporta: os nomes
# parecem não usados no arquivo e o require_version vem antes dos imports
"bzmux/gui.py" = ["F401", "E402"]
