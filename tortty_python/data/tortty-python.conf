# tortty-python — configuração
#
# Este é o arquivo de PADRÕES que vem com o programa. O seu
# (~/.config/tortty-python/tortty-python.conf, ou o que o `-c ARQ` apontar) é
# mesclado por cima
# dele, chave a chave: o que você não escrever vale daqui.
#
# Formato (o mesmo do kitty): uma opção por linha, `chave valor`, espaço nas
# pontas ignorado e `#` comentando até o fim da linha. Chave repetida: o último
# valor vence. Chave desconhecida é erro (o resto do arquivo continua valendo).
#
# Editar com o app aberto aplica na hora (Ctrl+Shift+F2 abre este arquivo do
# seu usuário no vim, numa aba nova). Erro é por linha: na carga inicial o que
# validou vale e a chave inválida fica no padrão (o toast mostra o primeiro
# erro); no reload, qualquer erro mantém a configuração que já estava valendo.

# programa aberto nas abas. Vazio = o $SHELL do ambiente (se não houver,
# /bin/bash); o `--cmd` da linha de comando vence este valor.
shell

# fonte da grade. Tamanho em PONTOS, de 4 a 30 (o Pango converte pelo DPI,
# então tela HiDPI fica certa sozinha). Só família monoespaçada: a célula é o avanço do
# "M" da própria fonte, e fonte proporcional desalinha o texto na grade.
font_family Monospace
font_size 12

# ligaduras tipográficas: off (nenhuma), standard (liga/calt: fi, ->, !=) ou
# all (standard + discricionárias, dlig). Só aparece em fonte que tenha
# (Fira Code, JetBrains Mono...): a célula continua uma por caractere.
ligatures standard

# espaço extra entre caracteres, em px (0 a 20): a célula cresce junto, o
# texto continua alinhado na grade (0 = só o avanço da fonte, o padrão)
letter_spacing 0

# cursor: block, beam (barra) ou underline. O pisca é on/off. Um app pode
# pedir outro cursor (CSI 6 q) e o pedido dele vale enquanto durar.
cursor_shape block
cursor_blink off

# cores do terminal (P49): `#RRGGBB`. Os valores abaixo SÃO o padrão
# embutido (a paleta clássica do xterm: mc, htop e ls --color foram
# calibrados nela) — mudar aqui é mudar o padrão de todo mundo.
foreground #d6d6d6
background #000000
cursor_color #d6d6d6
color0 #000000
color1 #cd0000
color2 #00cd00
color3 #cdcd00
color4 #0000ee
color5 #cd00cd
color6 #00cdcd
color7 #e5e5e5
color8 #7f7f7f
color9 #ff0000
color10 #00ff00
color11 #ffff00
color12 #5c5cff
color13 #ff00ff
color14 #00ffff
color15 #ffffff

# cores do chrome da janela (lateral, abas e cartões) — a paleta do terminal
# é outra coisa: foreground/background/colorN acima. As sete seguintes são
# estado: cartão sob o mouse, cartão ativo (verde), separador da aba.
chrome_bg #000000
chrome_hover_bg #141414
chrome_fg #e0e0e0
chrome_info_fg #8a8a8a
chrome_accent_bg #1f4d2e
chrome_accent_fg #ffffff
chrome_accent_info_fg #cfe3d5
chrome_sep #333333

# negrito (SGR 1) nas cores 0-7 vira a variante brilhante, como o xterm:
# off = só engrossa o traço (o comportamento antigo)
bold_as_bright off

# linhas de histórico acima da tela, de 1 a 10000 (wheel e Shift+PgUp leem
# daqui). Cada linha custa ~50 B por coluna: 10000 em 200 colunas são ~100 MB.
scrollback 1000

# margem em volta da grade, em px. O clique no mouse continua na célula certa.
window_padding_width 0

# BEL do app: none (ignora), visual (marca a aba) ou audible (apita)
bell none

# seleção com o mouse já vai para o clipboard, sem Ctrl+Shift+C
copy_on_select off

# o que a próxima execução herda desta: none (tudo limpo), layout (o padrão:
# os workspaces, as abas e o diretório de cada shell de volta, na mesma ordem)
# ou content (layout + a foto da tela de cada aba, com uma marca separando o
# que voltou do que a execução nova escrever).
restore_state layout

# log JSONL de depuração do ?2026 x scroll (uma linha por evento, com
# timestamp). `off` desliga; o `--debug-log ARQ` troca na linha de comando.
debug_log /tmp/tortty-python.debug.log

# -- shortcut table (P95) ---------------------------------------------------
# map CHORD ACTION [N] binds a chord and re-binds one already in use;
# unmap CHORD frees a default so the program sees the key again. Chord is
# modifier+key with ctrl/shift/alt/super, key is a GDK name (page_up, f2, up)
# or one character. Deleting a line here goes back to the built-in default.
map ctrl+shift+c copy
map ctrl+shift+v paste
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+n new_workspace
map ctrl+shift+q close_workspace
map ctrl+shift+f2 open_config
map ctrl+shift+f search
map ctrl+shift+up prev_prompt
map ctrl+shift+down next_prompt
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
map shift+home scroll_top
map shift+end scroll_bottom
map super+n new_workspace
map super+q close_workspace
map super+up ws_prev
map super+down ws_next
map alt+0 select_tab 10
map alt+1 select_tab 1
map alt+2 select_tab 2
map alt+3 select_tab 3
map alt+4 select_tab 4
map alt+5 select_tab 5
map alt+6 select_tab 6
map alt+7 select_tab 7
map alt+8 select_tab 8
map alt+9 select_tab 9
map ctrl+shift+0 select_workspace 10
map ctrl+shift+1 select_workspace 1
map ctrl+shift+2 select_workspace 2
map ctrl+shift+3 select_workspace 3
map ctrl+shift+4 select_workspace 4
map ctrl+shift+5 select_workspace 5
map ctrl+shift+6 select_workspace 6
map ctrl+shift+7 select_workspace 7
map ctrl+shift+8 select_workspace 8
map ctrl+shift+9 select_workspace 9
map super+0 select_workspace 10
map super+1 select_workspace 1
map super+2 select_workspace 2
map super+3 select_workspace 3
map super+4 select_workspace 4
map super+5 select_workspace 5
map super+6 select_workspace 6
map super+7 select_workspace 7
map super+8 select_workspace 8
map super+9 select_workspace 9
