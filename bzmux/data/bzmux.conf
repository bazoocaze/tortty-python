# bzmux — configuração
#
# Este é o arquivo de PADRÕES que vem com o programa. O seu
# (~/.config/bzmux/bzmux.conf, ou o que o `-c ARQ` apontar) é mesclado por cima
# dele, chave a chave: o que você não escrever vale daqui.
#
# Formato (o mesmo do kitty): uma opção por linha, `chave valor`, espaço nas
# pontas ignorado e `#` comentando até o fim da linha. Chave repetida: o último
# valor vence. Chave desconhecida não derruba nada — aparece no aviso.
#
# Editar com o app aberto aplica na hora (Ctrl+Shift+F2 abre este arquivo do
# seu usuário no vim, numa aba nova). Config inválida não aplica nada: fica
# valendo a anterior e o erro aparece num toast.

# programa aberto nas abas (o `--cmd` da linha de comando vence este valor)
shell /bin/bash
